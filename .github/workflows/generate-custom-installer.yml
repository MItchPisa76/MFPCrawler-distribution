name: Genera Installer Personalizzato

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Tag Versione dal Repo Privato (es. v1.0.0)'
        required: true
        type: choice
        options:
          - NEWT2
          - NTY
          - NEWT
          - V-new
          - v1.0.0-manual






      param_a:
        description: 'Dato A per Token (es. ID Cliente)'
        required: true
        default: 'CLIENT_001'
      param_b:
        description: 'Dato B per Token (es. Licenza)'
        required: true
        default: 'KEY_ABC123'

permissions:
  contents: write

jobs:
  inject-and-build:    
    runs-on: windows-latest

    steps:
    - name: Controlla repository pubblico
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configura Java (JDK 21 x64)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64

    - name: Prepara cartella target
      run: mkdir -p target

    - name: Scarica Fat JAR dal Repository Privato
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      shell: bash
      run: |
        TAG="${{ inputs.target_version }}"
        echo "Download del Fat JAR dalla release $TAG del repository privato..."
        
        # Download del JAR compiled dal repository privato tramite GitHub CLI
        gh release download "$TAG" \
          --repo "MitchPisa76/MFPCrawler" \
          --pattern "MFPCrawler-fat.jar" \
          --dir target/

    - name: Importa certificato SSL nel cacerts della JDK
      shell: bash
      run: |
        if [ -n "${{ secrets.LOCAL_SERVER_CERT }}" ]; then
          mkdir -p src/main/resources/certs
          echo "${{ secrets.LOCAL_SERVER_CERT }}" > src/main/resources/cert.pem        
        fi

    - name: SCRIPT DI INIEZIONE TOKEN (Eseguito nel Repo Pubblico)
      shell: bash
      run: |
        PARAM_A="${{ inputs.param_a }}"
        PARAM_B="${{ inputs.param_b }}"
        
        # 1. Genera la stringa Base64 combinata
        RAW_STRING="${PARAM_A}:${PARAM_B}"
        GENERATED_TOKEN=$(echo -n "$RAW_STRING" | base64)
        
        # 2. Crea il file di configurazione
        echo "app.token=$GENERATED_TOKEN" > token.properties
        
        # 3. Inietta token.properties direttamente dentro il Fat JAR scaricato
        "$JAVA_HOME/bin/jar" uf target/MFPCrawler-fat.jar token.properties
        
        echo "Token iniettato con successo in target/MFPCrawler-fat.jar"

    - name: Impacchetta Installer .exe con jpackage
      run: mvn jpackage:jpackage

    - name: Aggiorna il README.md pubblico con Data, Versione e Cliente
      shell: bash
      run: |
        TAG_NAME="${{ inputs.target_version }}"
        CLIENT_ID="${{ inputs.param_a }}"
        RELEASE_DATE=$(date +'%Y-%m-%d %H:%M')
        EXE_FILE=$(basename $(ls target/dist/*.exe 2>/dev/null | grep -v 'temp' | head -n 1)) || { echo "Nessun .exe trovato"; exit 1; }


        DOWNLOAD_URL="https://github.com/MItchPisa76/MFPCrawler-distribution/releases/download/$TAG_NAME/$CLIENT_ID/$EXE_FILE"

        # DOWNLOAD_URL="https://github.com/MitchPisa76/MFPCrawler/releases/download/$TAG_NAME/$EXE_FILE"
        NEW_ROW="| **$TAG_NAME** | $RELEASE_DATE | \`$CLIENT_ID\` | [⚡ Scarica $EXE_FILE]($DOWNLOAD_URL) |"
        
        sed -i "/<!-- DOWNLOAD_TABLE_MARKER -->/a $NEW_ROW" README.md
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: aggiornato README per $CLIENT_ID ($TAG_NAME) [skip ci]" && git push)

    - name: Pubblica l'exe nella Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ inputs.target_version }}.${{ inputs.param_a }}" # Oppure il tuo $TAG_NAME
        files: target/dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
