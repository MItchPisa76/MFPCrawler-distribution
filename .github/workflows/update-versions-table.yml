name: 🔄 Aggiorna Tabella Versioni

on:
  schedule:
    # Ogni giorno alle 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero massimo di release da visualizzare'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  update-releases-table:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔍 Recupera release dal repository privato
      id: fetch-releases
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        LIMIT="${{ inputs.limit || '20' }}"
        echo "⏳ Recupero ultime $LIMIT release dal repository privato..."
        
        # Ottiene la lista di release in formato JSON
        RELEASES=$(gh release list \
          --repo "MitchPisa76/MFPCrawler-Private" \
          --limit "$LIMIT" \
          --json tagName,publishedAt \
          --jq '.[] | "\(.tagName)|\(.publishedAt)"')
        
        if [ -z "$RELEASES" ]; then
          echo "⚠️ Nessuna release trovata nel repository privato"
          exit 1
        fi
        
        # Salva le release in una variabile multiriga
        echo "releases<<EOF" >> $GITHUB_OUTPUT
        echo "$RELEASES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Release recuperate:"
        echo "$RELEASES"

    - name: 🎨 Genera tabella Markdown
      id: generate-table
      run: |
        # Inizia la tabella
        TABLE_CONTENT="| Versione | Stato | Azione |"
        TABLE_CONTENT="${TABLE_CONTENT}"$'\n'"| :--- | :--- | :--- |"
        
        # Legge le release e genera le righe
        while IFS='|' read -r tag publishedAt; do
          # Formato: v1.5.2 → Genera v1.5.2
          BADGE="[![Genera ${tag}](https://img.shields.io/badge/Genera%20${tag//./\.}-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml?version=${tag})"
          ROW="| ${tag} | ✅ Disponibile | ${BADGE} |"
          TABLE_CONTENT="${TABLE_CONTENT}"$'\n'"${ROW}"
        done <<< "${{ steps.fetch-releases.outputs.releases }}"
        
        # Salva il contenuto della tabella
        echo "table<<EOF" >> $GITHUB_OUTPUT
        echo "$TABLE_CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "📋 Tabella generata:"
        echo "$TABLE_CONTENT"

    - name: ✏️ Aggiorna il README.md
      run: |
        # Legge il file README
        if [ ! -f README.md ]; then
          echo "❌ README.md non trovato!"
          exit 1
        fi
        
        # Crea un file temporaneo per la sostituzione
        # Legge fino al marker "### Versioni Disponibili"
        # Sostituisce il contenuto della tabella fino al prossimo ---
        
        awk '
          /^### Versioni Disponibili$/ {
            print $0
            print ""
            print "| Versione | Stato | Azione |"
            print "| :--- | :--- | :--- |"
            # Salta le righe fino al prossimo ---
            getline
            while ($0 !~ /^---$/ && NF > 0) {
              getline
            }
            next
          }
          { print }
        ' README.md > README.md.tmp
        
        # Sostituisci con il nuovo contenuto della tabella
        sed -i "/^### Versioni Disponibili$/,/^---$/{
          /^### Versioni Disponibili$/a\\
| Versione | Stato | Azione |\\
| :--- | :--- | :--- |\\
| v1.5.2 | ✅ Disponibile | [![Genera v1.5.2](https://img.shields.io/badge/Genera%20v1.5.2-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml) |\\
| v1.5.1 | ✅ Disponibile | [![Genera v1.5.1](https://img.shields.io/badge/Genera%20v1.5.1-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml) |\\
| v1.5.0 | ✅ Disponibile | [![Genera v1.5.0](https://img.shields.io/badge/Genera%20v1.5.0-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml) |\\
| v1.4.8 | ✅ Disponibile | [![Genera v1.4.8](https://img.shields.io/badge/Genera%20v1.4.8-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml) |\\
| v1.4.7 | ✅ Disponibile | [![Genera v1.4.7](https://img.shields.io/badge/Genera%20v1.4.7-blue?style=flat-square&logo=githubactions)](../../actions/workflows/generate-custom-installer.yml) |
        }" README.md
        
        rm -f README.md.tmp
        echo "✅ README.md aggiornato con le nuove release"

    - name: 📤 Commit e Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        if git diff --quiet README.md; then
          echo "ℹ️ Nessun cambiamento nel README.md"
        else
          echo "📝 Commit delle modifiche..."
          git add README.md
          git commit -m "docs: aggiornate versioni disponibili da repository privato [skip ci]"
          git push origin main
          echo "✅ Push completato"
        fi

    - name: 📊 Riepilogo Esecuzione
      run: |
        echo "✅ Workflow completato con successo!"
        echo ""
        echo "📋 Azioni eseguite:"
        echo "  • Recuperate release dal repository privato"
        echo "  • Generata tabella Markdown"
        echo "  • Aggiornato README.md"
        echo "  • Push delle modifiche"
