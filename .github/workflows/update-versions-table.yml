name: 🔄 Aggiorna Tabella Versioni

on:
  schedule:
    # Ogni giorno alle 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero massimo di release da visualizzare'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  update-releases-table:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔍 Recupera release dal repository privato
      id: fetch-releases
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        LIMIT="${{ inputs.limit || '20' }}"
        echo "⏳ Recupero ultime $LIMIT release dal repository privato..."
        
        RELEASES=$(gh release list \
          --repo "MitchPisa76/MFPCrawler" \
          --limit "$LIMIT" \
          --json tagName,publishedAt \
          --jq '.[] | "\(.tagName)|\(.publishedAt)"')
        
        if [ -z "$RELEASES" ]; then
          echo "⚠️ Nessuna release trovata nel repository privato"
          exit 1
        fi
        
        echo "releases<<EOF" >> $GITHUB_OUTPUT
        echo "$RELEASES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Release recuperate:"
        echo "$RELEASES"

    - name: 📝 Genera lista versioni per workflow dispatch
      id: versions-list
      run: |
        RELEASES="${{ steps.fetch-releases.outputs.releases }}"
        
        # Estrae solo i tag e crea una lista YAML
        OPTIONS="        options:"
        while IFS='|' read -r tag publishedAt; do
          OPTIONS="${OPTIONS}"$'\n'"          - ${tag}"
        done <<< "$RELEASES"
        
        # Salva in output multiriga
        echo "options<<EOF" >> $GITHUB_OUTPUT
        echo "$OPTIONS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Opzioni YAML generate:"
        echo "$OPTIONS"

    - name: 🎨 Genera tabella Markdown
      id: generate-table
      run: |
        TABLE_CONTENT="| Versione | Stato | Azione |"
        TABLE_CONTENT="${TABLE_CONTENT}"$'\n'"| :--- | :--- | :--- |"
        
        while IFS='|' read -r tag publishedAt; do
          ENCODED_TAG="${](#)*
