name: 🔄 Aggiorna Tabella Versioni

on:
  schedule:
    # Ogni giorno alle 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero massimo di release da visualizzare'
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: read
jobs:
  update-releases-table:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_PAT }}

    - name: 🔍 Recupera release dal repository privato
      id: fetch-releases
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
        LIMIT="${{ inputs.limit || '20' }}"
        echo "⏳ Recupero ultime $LIMIT release dal repository privato..."
        
        RELEASES=$(gh release list \
          --repo "MitchPisa76/MFPCrawler" \
          --limit "$LIMIT" \
          --json tagName,publishedAt \
          --jq '.[] | "\(.tagName)|\(.publishedAt)"')
        
        if [ -z "$RELEASES" ]; then
          echo "⚠️ Nessuna release trovata nel repository privato"
          exit 1
        fi
        
        echo "releases<<EOF" >> $GITHUB_OUTPUT
        echo "$RELEASES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Release recuperate:"
        echo "$RELEASES"

    - name: 📝 Genera lista versioni per workflow dispatch
      id: versions-list
      run: |
        RELEASES="${{ steps.fetch-releases.outputs.releases }}"
        
        # Estrae solo i tag e crea una lista YAML
        OPTIONS="        options:"
        while IFS='|' read -r tag publishedAt; do
          OPTIONS="${OPTIONS}"$'\n'"          - ${tag}"
        done <<< "$RELEASES"
        
        # Salva in output multiriga
        echo "options<<EOF" >> $GITHUB_OUTPUT
        echo "$OPTIONS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "✅ Opzioni YAML generate:"
        echo "$OPTIONS"

    - name: 🎨 Genera tabella Markdown
      id: generate-table
      run: |
        TABLE_CONTENT="| Versione | Stato | Azione |"
        TABLE_CONTENT="${TABLE_CONTENT}"$'\n'"| :--- | :--- | :--- |"
        
        while IFS='|' read -r tag publishedAt; do
          ENCODED_TAG="${tag//./%2E}"
          WORKFLOW_URL="https://github.com/MItchPisa76/MFPCrawler-distribution/actions/workflows/generate-custom-installer.yml"
          BADGE="[![Genera ${tag}](https://img.shields.io/badge/Genera%20${ENCODED_TAG}-blue?style=flat-square&logo=githubactions)](${WORKFLOW_URL})"
          ROW="| ${tag} | ✅ Disponibile | ${BADGE} |"
          TABLE_CONTENT="${TABLE_CONTENT}"$'\n'"${ROW}"
        done <<< "${{ steps.fetch-releases.outputs.releases }}"
        
        echo "table<<EOF" >> $GITHUB_OUTPUT
        echo "$TABLE_CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "📋 Tabella generata:"
        echo "$TABLE_CONTENT"

    - name: ✏️ Aggiorna il README.md
      run: |
        if [ ! -f README.md ]; then
          echo "❌ README.md non trovato!"
          exit 1
        fi
        
        TABLE_CONTENT="${{ steps.generate-table.outputs.table }}"
        echo "$TABLE_CONTENT" > /tmp/table_content.txt
        
        perl -i -0pe '
          open(my $fh, "<", "/tmp/table_content.txt") or die "Cannot open file: $!";
          my $table = do { local $/; <$fh> };
          close($fh);
          $table =~ s/\$/\\\$/g;
          $table =~ s/\\/\\\\/g;
          s/(### Versioni Disponibili\s*\n)(.*?)(\n---)/\1$table\3/s;
        ' README.md
        
        echo "✅ README.md aggiornato con le nuove release"

    - name: 🔄 Aggiorna generate-custom-installer.yml con le versioni
      run: |
        WORKFLOW_FILE=".github/workflows/generate-custom-installer.yml"
        OPTIONS="${{ steps.versions-list.outputs.options }}"
        
        if [ ! -f "$WORKFLOW_FILE" ]; then
          echo "❌ File $WORKFLOW_FILE non trovato!"
          exit 1
        fi
        
        echo "📝 Aggiornamento della sezione options nel file $WORKFLOW_FILE..."
        
        # Salva le opzioni in un file temporaneo
        echo "$OPTIONS" > /tmp/options.txt
        
        # Sostituisce la sezione options usando perl
        perl -i -0pe '
          open(my $fh, "<", "/tmp/options.txt") or die "Cannot open file: $!";
          my $options = do { local $/; <$fh> };
          close($fh);
          $options =~ s/\$/\\\$/g;
          $options =~ s/\\/\\\\/g;
          s/(target_version:\s*\n\s*description:.*?\n\s*required: true\s*\n\s*type: choice\s*\n)(\s*options:(\s*\n\s*- [^\n]+)*)/$1$options/s;
        ' "$WORKFLOW_FILE"
        
        echo "✅ File aggiornato con le nuove versioni"
        
    - name: 📤 Commit e Push
      env:
         GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      run: |
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         
         # Use the token directly in the remote URL
         
         #git remote set-url origin "https://${GH_TOKEN}@github.com/MItchPisa76/MFPCrawler-distribution.git"
         git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/MItchPisa76/MFPCrawler-distribution.git"
         
         if git diff --quiet README.md .github/workflows/generate-custom-installer.yml 2>/dev/null; then
           echo "ℹ️ Nessun cambiamento nei file"
         else
           echo "📝 Commit delle modifiche..."
           git add README.md .github/workflows/generate-custom-installer.yml
           git commit -m "docs: aggiornate versioni disponibili da repository privato [skip ci]"

           # Pull latest changes before pushing
           git pull --rebase origin main
           
           git push origin main
           echo "✅ Push completato"
         fi

    - name: 📊 Riepilogo Esecuzione
      run: |
        echo "✅ Workflow completato con successo!"
        echo ""
        echo "📋 Azioni eseguite:"
        echo "  • Recuperate release dal repository privato"
        echo "  • Generata lista versioni disponibili"
        echo "  • Generata tabella Markdown"
        echo "  • Aggiornato README.md"
        echo "  • Sincronizzate versioni in generate-custom-installer.yml"
        echo "  • Push delle modifiche"
