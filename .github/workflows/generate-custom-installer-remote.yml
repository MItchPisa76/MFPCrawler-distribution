name: Genera Installer Personalizzato (da remoto nodeJS)

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Tag Versione dal Repo Privato (es. v1.0.0)'
        required: true    
        default: 'Newt2.0'
      customer_name:
        description: 'Customer Name (es.Cliente)'
        required: true
        default: 'CLIENT_001'
      customer_info:
        description: 'Customer TokenI (es. IDUNivoco)'
        required: true
        default: 'KEY_ABC123'
      token_extra:
        description: 'Version Token (es. rev.special)'
        required: false
        default: 'mtc'
      server_url:
        description: 'URL Server di Destinazione'
        required: false
        default: 'http://192.168.1.100:8080'
      ssl_cert:
        description: 'Certificato SSL PEM (Necessario)'
        required: true
        type: string
      so_selected:
        description: 'formato out'
        required: true
        type: string
        default: 'WIN64EXE'
permissions:
  contents: write

jobs:
  inject-and-build:    
    runs-on: windows-latest

    steps:    
    - name: Mostra i parametri nei log e nel sommario
      run: |
        "### 🚀 Parametri di input utilizzati" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
        "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| Parametro | Valore Inserito |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| :--- | :--- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Target Version** | `${{ inputs.target_version }}` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Param A (Customer)** | `${{ inputs.param_a }}` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Param B (Token ID)** | `${{ inputs.param_b }}` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Token Extra** | `${{ inputs.token_extra }}` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Server URL** | `${{ inputs.server_url }}` |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "| **Eseguito da** | @${{ github.actor }} |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    - name: Controlla repository pubblico
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configura Java (JDK 21 x64)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64

    - name: Prepara cartella target
      run: mkdir -p target

    - name: Scarica Fat JAR dal Repository Privato
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      shell: bash
      run: |
        TAG="${{ inputs.target_version }}"
        echo "Download del Fat JAR dalla release $TAG del repository privato..."
        
        gh release download "$TAG" \
          --repo "MitchPisa76/MFPCrawler" \
          --pattern "MFPCrawler-fat.jar" \
          --dir target/

    - name: Inietta Certificato SSL se fornito
      shell: bash
      run: |
        CERT_CONTENT="${{ inputs.ssl_cert }}"
        if [ -n "$CERT_CONTENT" ]; then
          echo "Certificato fornito, iniezione in corso..."
          mkdir -p src/main/resources/certs
          echo "$CERT_CONTENT" > src/main/resources/certs/cert.pem
          
          cd src/main/resources
          "$JAVA_HOME/bin/jar" uf ../../../target/MFPCrawler-fat.jar certs/cert.pem
          echo "Certificato iniettato con successo."
        else
          echo "Nessun certificato SSL fornito tramite parametro."
        fi

    - name: SCRIPT DI INIEZIONE TOKEN (Eseguito nel Repo Pubblico)
      shell: bash
      run: |
        PARAM_A="${{ inputs.param_a }}"
        PARAM_B="${{ inputs.param_b }}"
        
        RAW_STRING="${PARAM_A}:${PARAM_B}:${{ inputs.token_extra }}"
        GENERATED_TOKEN=$(echo -n "$RAW_STRING" | base64)
        
        echo "customer.name=${{ inputs.param_a }}\n" > token.properties
        echo "user.token=${{ inputs.param_b }}\n" >> token.properties
        echo "app.token=$GENERATED_TOKEN" >> token.properties 
        
        "$JAVA_HOME/bin/jar" uf target/MFPCrawler-fat.jar token.properties
        
        echo "Token iniettato con successo in target/MFPCrawler-fat.jar"

    - name: Impacchetta Installer .exe con jpackage e Parametri
      run: |
        mvn jpackage:jpackage -X `
          -Dinstaller.nomeRegistrato="${{ inputs.param_a }}" `
          -Dinstaller.infoReg="${{ inputs.param_b }}" `
          -Dinstaller.server="${{ inputs.server_url }}"

    - name: Recupera i file temporanei della build
      uses: actions/upload-artifact@v4
      with:
        name: jpackage-temp-files
        path: int/
        if-no-files-found: warn

    - name: Carica Installer .exe come Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MFPCrawler-Installer-${{ inputs.param_a }}-${{ inputs.param_b }}
        path: target/dist/*.exe
        if-no-files-found: error
        retention-days: 7
